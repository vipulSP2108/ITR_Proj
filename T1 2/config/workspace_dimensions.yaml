# Workspace Ground-Truth Physical Dimensions & Camera Setup
# Verified via Physical Ruler Measurements and Overhead RealSense D435 Setup

camera:
  height_above_board_mm: 470.0   # ~47 cm above table/board as physically measured
  sensor_width_px: 640
  sensor_height_px: 480
  focal_length_px: 344.0         # Wide FOV RealSense D435 infrared stream (FOV ~86 deg)
  principal_point:
    cx: 320.0
    cy: 240.0
  table_scale_mm_per_px: 1.366   # 470 mm / 344 px = 1.366 mm/pixel

green_mat:
  width_mm: 300.0                # 30 cm x 30 cm working foam mat
  height_mm: 300.0
  expected_width_px: 220         # 300 mm / 1.366 mm/px = 220 pixels
  expected_height_px: 220

wooden_board:
  is_fixed: false                # Board is moveable; pipeline MUST detect dynamically
  total_length_mm: 300.0
  total_width_mm: 100.0
  cutout_gap_mm: 25.0            # Uniform spacing between consecutive cutouts
  cutout_order:
    - "triangle"                 # Top cutout on board
    - "square"                   # Second cutout
    - "hexagon"                  # Third cutout
    - "circle"                   # Fourth cutout (closest to user)
  cutouts:
    circle:
      shape: "circle"
      diameter_mm: 50.0          # 5.0 cm measured with physical ruler
      radius_mm: 25.0
      expected_radius_px: 18.3
      circularity_threshold: 0.72
    hexagon:
      shape: "hexagon"
      height_mm: 45.0            # 4.5 cm measured across flats with ruler
      side_mm: 26.0
      expected_span_px: 33.0
    square:
      shape: "square"
      side_length_mm: 50.0       # 5.0 cm x 5.0 cm measured with ruler
      expected_side_px: 36.6
    triangle:
      shape: "triangle"
      height_mm: 45.0            # 4.5 cm measured with ruler
      expected_height_px: 33.0

manipulation_heights:
  z_hover_mm: 105.0
  z_grasp_default_mm: 35.0       # Default height for flat metallic peg (calibrated from ruler)
  z_transit_mm: 105.0
  z_sock_hover_mm: 85.0
  z_insert_default_mm: 28.0      # Insertion depth into board cutout

robot_mounting:
  base_center_pixel_estimate:
    u: 485.0
    v: 215.0
  coordinate_conventions:
    home_pose_direction: "-X"    # Motor raw count 0 / 4096 (180 deg)
    board_cutout_direction: "+X" # Motor raw count 2048 (0 deg)
    foam_mat_direction: "+Y"     # Motor raw count 3072 (+90 deg)
    vertical_direction: "+Z"     # Upward normal from table
