# Tunable numbers for pick_place.py. NO table coordinates live here or in the code:
# positions of pegs, holes, the mat edge, parking spots and the planning area are all measured
# by the camera through config/camera_robot_calib.yaml every time the script runs.
# Everything below is a size, a height above the mat, or a safety buffer (mm / degrees).

heights_above_mat_mm:
  grip_centre_min: 55.0        # lowest place on a peg the fingers may grip (palm must stay above the peg top)
  grip_centre_max: 70.0        # highest (30 mm below the peg top)
  hover_over_peg_top: 22.0     # grip centre at least this far above a peg top before descending (fingertips clear by ~10)
  hover_over_peg_top_max: 50.0 # ... and up to this far when the arm can reach that high there (it uses the highest it can)
  carry_peg_bottom: 40.0       # bottom of a carried peg while travelling
  release_gap: 4.0             # bottom of the peg this far above the surface when the fingers open
  never_below: 15.0            # grip centre is never commanded lower than this

gripper:
  # gripper counts <-> finger gap: see the crank model in calibration/hw_common.py (grip_counts_for_gap)
  finger_thickness_mm: 12.0    # material outside the gap
  finger_half_width_mm: 18.0   # half finger width along the arm's radial direction
  open_extra_mm: 30.0          # fingers open this much wider than the peg before descending ...
  open_extra_min_mm: 16.0      # ... or less when a neighbour is close, but never less than this
  release_extra_mm: 10.0       # ... and only this much wider when letting go (neighbours are close)
  release_extra_min_mm: 4.0    # ... adaptive minimum when releasing into a hole between tight neighbours

safety_buffers_mm:
  hard_clearance: 30.0         # minimum free gap, edge to edge, between (carried peg + fingers) and any other peg
  preferred_clearance: 60.0    # the planner pays extra for coming closer than this, so it keeps a wide berth when it can
  end_clearance: 8.0           # reduced minimum right at the pick / release spot (there the finger check below applies)
  finger_clearance: 15.0       # free gap required between the open fingers and neighbouring pegs when picking / releasing
  hole_finger_clearance: 6.0   # adaptive clearance when releasing into a hole between seated neighbours
  mat_edge: 30.0               # pegs are accepted up to this far outside the detected mat edge
  seated_check: 14.0           # a peg in a hole counts as seated (upright) only if foot and top agree this well
  peg_shape_check: 42.0        # a blob is a peg only if its foot and its top agree this well (fallen pegs have spread > 50 mm)
  parking_from_pegs: 90.0      # a parking spot is at least this far (centre to centre) from every other peg
  parking_from_board: 60.0     # ... and this far from the line of holes
  parking_from_mat_edge: 35.0

top_grasp:
  min_down_deg: 65.0           # tool never tilts more than 25 deg from vertical while holding a peg
  upright_warn_deg: 80.0       # warn when a peg would be released more tilted than this
  retreat_min_down_deg: 45.0   # empty gripper may tilt more while rising off a placed peg

orientation:
  max_grip_misalignment_deg: 42.0   # a square/hexagon/triangle rotated more than this to the jaws is not gripped
  position_play_needed_mm: 1.0      # a rotated peg must still have this much room on every side of its hole
  default_fit_deg: 5.0              # allowed rotation error when a hole's size could not be measured
  triangle_fit_deg: 18.0            # a triangle peg drops into its hole up to about this much rotation error

insertion_search:                # "feel for the hole": used when a peg is lowered into a hole
  enabled: true
  contact_error_counts: 12       # joint lag (counts, summed over shoulder/elbow/wrist) that means "touching something"
  step_down_mm: 1.5              # lowering step while feeling for contact
  press_mm: 1.5                  # how far it keeps pressing down while searching sideways
  radii_mm: [1.5, 3.0, 4.5]      # sideways search circles around the hole centre
  max_below_board_mm: 6.0        # never push the peg bottom further than this below the board's top face

calibration_check:               # python pick_place.py --check-calibration
  fingertip_above_mat: 135.0     # above the 100 mm pegs
  tool_tilt_deg: 30.0            # tilted so the camera sees the fingertips
  keep_from_pegs: 80.0           # test spots are at least this far from every peg (centre to centre)
  points: 4                      # spots for --check-calibration
  tune_points: 9                 # spots for --tune-calibration

placement_fine_tune_mm:          # small corrections found by watching real runs (2026-11-11)
  # positive = release the peg this much FURTHER from the robot than the hole centre the camera measured,
  # negative = nearer. Change these if pegs keep landing a little short / long in their holes.
  outward:
    circle: 0.0      # (5.0 on 2026-11-11 only compensated a drifted calibration)
    hexagon: 0.0
    square: 0.0
    triangle: 0.0

suggested_layout:                # python pick_place.py --suggest-layout  (where to stand the pegs for the best results)
  from_mat_edge: 35.0            # spots are at least this far inside the mat
  from_board: 55.0               # ... this far from the row of holes
  min_from_base: 95.0            # ... this far from the robot base axis
  min_x_in_front: 60.0         # ... and at least this far IN FRONT of the base (beside it the camera sees pegs badly)
  max_from_base: 195.0           # ... and not further than this (most accurate zone, tool fully vertical)
  image_margin_px: 40            # the whole 100 mm tall peg must stay this far inside the camera picture
